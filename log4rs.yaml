refresh_rate: 30 seconds

appenders:
  stdout:
    kind: console
    encoder:
      pattern: "{d} - {l} - {m}{n}"
  file:
    kind: file
    path: "logs/calculator.log"
    encoder:
      pattern: "{d} - {l} - {m}{n}"

root:
  level: info
  appenders:
    - file
    - stdout

loggers:
  calculator:
    level: info
    appenders:
      - file
      - stdout
    additive: false 